name: Playwright-Cucumber-CI

on:
  push:
    branches: [master]

  pull_request:
    branches: [master]

jobs:
  automation-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CI: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Execute Playwright and Cucumber Tests
        run: |
          npm run test
          npm run test:html
